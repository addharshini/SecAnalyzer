name: Security POC (Strict - security-poc branch only)

on:
  push:
    branches:
      - security-poc
  pull_request:
    branches:
      - security-poc

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (Fail on High Severity)
        run: semgrep --config=p/security-audit --severity ERROR .

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # REQUIRED to scan full history

      - name: Run Gitleaks (Fail if Secrets Found)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --verbose --redact