name: Security POC (Strict - security-poc branch only)

on:
  push:
    branches:
      - security-poc
  pull_request:
    branches:
      - security-poc

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (Fail on ANY finding)
        run: semgrep --config=p/security-audit .

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (Strict Mode)
        uses: gitleaks/gitleaks-action@v2