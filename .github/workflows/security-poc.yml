name: Security POC (Branch Enforced)

on:
  push:
    branches:
      - security-poc
  pull_request:
    branches:
      - security-poc

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (Fail on ERROR)
        run: semgrep --config=p/security-audit --severity ERROR .

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Important for scanning history

      - name: Run Gitleaks (Fail if secrets found)
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --verbose --redact