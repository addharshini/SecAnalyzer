name: Security POC (Monitor Mode)

on:
  push:
    branches:
      - security-poc
  pull_request:
    branches:
      - security-poc

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: semgrep --config=p/security-audit .

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2