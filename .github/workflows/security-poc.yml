name: Security POC (Strict - security-poc branch only)

on:
  push:
    branches:
      - security-poc
  pull_request:
    branches:
      - security-poc

jobs:
  semgrep:
    name: Semgrep Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (Fail on ANY finding)
        run: semgrep --config=p/security-audit .

  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSfL https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | sh
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks (Fail if secrets found)
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --verbose \
            --exit-code 1